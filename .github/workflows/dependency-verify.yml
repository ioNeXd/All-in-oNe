name: Temporary dependency verification

on:
  push:
    branches:
      - fix/dev-dependency-vulnerabilities

permissions:
  contents: read

jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[dependency-verify]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm test
