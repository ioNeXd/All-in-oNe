name: Build and Release

# CI em push para main e PRs; release em tags v* (padrão SemVer: v0.1.0).
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build

      - name: Conferir versão do manifest × tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::manifest.json (v$MANIFEST_VERSION) difere da tag ($GITHUB_REF_NAME). Rode \"npm version $TAG_VERSION\" e suba antes de taggear."
            exit 1
          fi

      - name: Gerar checksums SHA-256
        id: checksums
        run: |
          {
            echo "body<<EOF"
            echo "### Checksums SHA-256"
            echo ""
            echo "Confira antes de instalar manualmente: `sha256sum <arquivo>`."
            echo ""
            echo "sha256 main.js: $(sha256sum main.js | awk '{print $1}')"
            echo "sha256 manifest.json: $(sha256sum manifest.json | awk '{print $1}')"
            echo "sha256 styles.css: $(sha256sum styles.css | awk '{print $1}')"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Assinar assets (GPG)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in main.js manifest.json styles.css; do
            if [ -n "$GPG_PASSPHRASE" ]; then
              echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor --output "$f.sig.asc" "$f"
            else
              gpg --batch --yes --detach-sign --armor --output "$f.sig.asc" "$f"
            fi
          done

      - name: Create GitHub Release com os artefatos do plugin
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          body: ${{ steps.checksums.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      - name: Anexar assinaturas ao release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        with:
          files: |
            main.js.sig.asc
            manifest.json.sig.asc
            styles.css.sig.asc
          fail_on_unmatched_files: true
